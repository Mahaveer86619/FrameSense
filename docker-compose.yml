services:
  app:
    container_name: framesense
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - db
    restart: always
    networks:
      - framesense-network

  db:
    image: postgres:latest
    container_name: framesense_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: framesense_db
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always
    networks:
      - framesense-network

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - framesense-network
    healthcheck:
      test:
        ["CMD-SHELL", "awslocal s3 ls && awslocal sqs list-queues || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Kafka (if using QUEUE_DRIVER=kafka)
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:latest
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #   networks:
  #     - framesense-network

  # kafka:
  #   image: confluentinc/cp-kafka:latest
  #   depends_on:
  #     - zookeeper
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #   networks:
  #     - framesense-network

volumes:
  db_data:

networks:
  framesense-network:
    driver: bridge
