services:
  app:
    container_name: framesense
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - db
    restart: always

  db:
    image: postgres:latest
    container_name: framesense_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: framesense_db
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - framesense-network
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  framesense-network:
    driver: bridge
